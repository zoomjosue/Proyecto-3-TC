[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-machine-simulator"
version = "1.0.0"
description = "Simulador determinista de Maquinas de Turing de una cinta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
tm-sim = "turing_machine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

